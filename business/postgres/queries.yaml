base:
  ping: |
    SELECT 1 as value

friends:
  list_strangers: |
    SELECT u.id, u.username, u.profile_picture_url
    FROM platform.user u
    WHERE u.id != $1
      AND u.id NOT IN (
        SELECT CASE
          WHEN fr.sender_id = $1 THEN fr.receiver_id
          ELSE fr.sender_id
        END
        FROM friend.friend_request fr
        WHERE (fr.sender_id = $1 OR fr.receiver_id = $1)
          AND fr.status IN ('pending', 'accepted')
      )
    ORDER BY u.username ASC
    LIMIT $2 OFFSET $3

  insert_request: |
    INSERT INTO friend.friend_request (id, sender_id, receiver_id, status)
    VALUES ($1, $2, $3, 'pending')
    RETURNING id, sender_id, receiver_id, status, created_at, updated_at

  get_sent_requests: |
    SELECT fr.id, fr.sender_id, fr.receiver_id, fr.status, fr.created_at, fr.updated_at,
           s.username AS sender_username,
           r.username AS receiver_username
    FROM friend.friend_request fr
    JOIN platform.user s ON fr.sender_id = s.id
    JOIN platform.user r ON fr.receiver_id = r.id
    WHERE fr.sender_id = $1 AND fr.status = 'pending'
    ORDER BY fr.created_at DESC

  get_received_requests: |
    SELECT fr.id, fr.sender_id, fr.receiver_id, fr.status, fr.created_at, fr.updated_at,
           s.username AS sender_username,
           r.username AS receiver_username
    FROM friend.friend_request fr
    JOIN platform.user s ON fr.sender_id = s.id
    JOIN platform.user r ON fr.receiver_id = r.id
    WHERE fr.receiver_id = $1 AND fr.status = 'pending'
    ORDER BY fr.created_at DESC

  accept_request: |
    UPDATE friend.friend_request
    SET status = 'accepted', updated_at = NOW()
    WHERE id = $1 AND receiver_id = $2 AND status = 'pending'
    RETURNING id, sender_id, receiver_id, status, created_at, updated_at

  reject_request: |
    UPDATE friend.friend_request
    SET status = 'rejected', updated_at = NOW()
    WHERE id = $1 AND receiver_id = $2 AND status = 'pending'
    RETURNING id, sender_id, receiver_id, status, created_at, updated_at

  get_friends: |
    SELECT u.id, u.username, u.profile_picture_url,
           lm.id AS last_msg_id,
           lm.sender_id AS last_msg_sender_id,
           lm.content AS last_msg_content,
           lm.created_at AS last_msg_created_at
    FROM platform.user u
    JOIN friend.friend_request fr
      ON (fr.sender_id = $1 AND fr.receiver_id = u.id)
      OR (fr.receiver_id = $1 AND fr.sender_id = u.id)
    LEFT JOIN LATERAL (
      SELECT m.id, m.sender_id, m.content, m.created_at
      FROM msg.message m
      WHERE (m.sender_id = $1 AND m.receiver_id = u.id)
         OR (m.sender_id = u.id AND m.receiver_id = $1)
      ORDER BY m.created_at DESC
      LIMIT 1
    ) lm ON true
    WHERE fr.status = 'accepted'
    ORDER BY u.username ASC

messages:
  insert: |
    INSERT INTO msg.message (id, sender_id, receiver_id, content)
    VALUES ($1, $2, $3, $4)
    RETURNING id, sender_id, receiver_id, content, created_at

  get_conversation: |
    SELECT id, sender_id, receiver_id, content, created_at
    FROM msg.message
    WHERE (sender_id = $1 AND receiver_id = $2)
       OR (sender_id = $2 AND receiver_id = $1)
    ORDER BY created_at DESC
    LIMIT $3 OFFSET $4