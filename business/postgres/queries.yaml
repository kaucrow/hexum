base:
  ping: |
    SELECT 1 as value

game:
  get_full_data: |
    SELECT
    g.id,
    g.external_id,
    g.game_name,
    g.first_release_date,
    g.cover_url,
    g.rating,
    g.critic_rating,
    g.total_rating_count,
    g.summary,
    COALESCE(
      jsonb_agg(DISTINCT
          jsonb_build_object(
              'id', p.id,
              'external_id', p.external_id,
              'platform_name', p.platform_name,
              'generation', p.generation
          )
      ) FILTER (WHERE p.id IS NOT NULL),
      '[]'::jsonb
    ) AS platforms,
    COALESCE(
      jsonb_agg(DISTINCT
          jsonb_build_object(
              'id', gen.id,
              'external_id', gen.external_id,
              'genre_name', gen.genre_name
          )
      ) FILTER (WHERE gen.id IS NOT NULL),
      '[]'::jsonb
    ) AS genres,
    COALESCE(
      jsonb_agg(DISTINCT
          jsonb_build_object(
              'id', c.id,
              'external_id', c.external_id,
              'company_name', c.company_name,
              'role', gc.role
          )
      ) FILTER (WHERE c.id IS NOT NULL),
      '[]'::jsonb
    ) AS companies
    FROM
      game.game g
    LEFT JOIN
      game.game_platform gp ON g.id = gp.game_id
    LEFT JOIN
      platform.platform p ON gp.platform_id = p.id
    LEFT JOIN
      game.game_genre gg ON g.id = gg.game_id
    LEFT JOIN
      genre.genre gen ON gg.genre_id = gen.id
    LEFT JOIN
      game.game_company gc ON g.id = gc.game_id
    LEFT JOIN
      company.company c ON gc.company_id = c.id
    WHERE g.id = $1
    GROUP BY
      g.id

  get_many_by_ids: |
    SELECT id, external_id, game_name, cover_url
    FROM game.game
    WHERE id = ANY($1)

  get_external_ids_by_internal_ids: |
    SELECT external_id
    FROM game.game
    WHERE id = ANY($1) AND external_id IS NOT NULL

  upsert_from_external: |
    WITH upsert_game AS (
      INSERT INTO game.game (
        id, external_id, game_name,
        first_release_date, cover_url, summary
      )
      VALUES ($1, $2, $3, $4, $5, $6)
      ON CONFLICT (external_id) DO UPDATE
      SET game_name = EXCLUDED.game_name,
          first_release_date = COALESCE(EXCLUDED.first_release_date, game.game.first_release_date),
          cover_url = COALESCE(EXCLUDED.cover_url, game.game.cover_url),
          summary = COALESCE(EXCLUDED.summary, game.game.summary)
      RETURNING id
    ),
    delete_old_links AS (
      DELETE FROM game.game_platform
      WHERE game_id = (SELECT id FROM upsert_game)
    ),
    insert_new_links AS (
      INSERT INTO game.game_platform (game_id, platform_id)
      SELECT (SELECT id FROM upsert_game), UNNEST($7::uuid[])
      ON CONFLICT (game_id, platform_id) DO NOTHING
    )
    SELECT id FROM upsert_game

  delete_game_genres: |
    DELETE FROM game.game_genre
    WHERE game_id = $1

  insert_game_genres: |
    INSERT INTO game.game_genre (game_id, genre_id)
    SELECT $1, UNNEST($2::uuid[])
    ON CONFLICT (game_id, genre_id) DO NOTHING

  delete_game_companies: |
    DELETE FROM game.game_company
    WHERE game_id = $1

  insert_game_companies: |
    INSERT INTO game.game_company (game_id, company_id, role)
    SELECT $1, UNNEST($2::uuid[]), UNNEST($3::varchar[])
    ON CONFLICT (game_id, company_id, role) DO NOTHING

  increment_view_count: |
    UPDATE game.game SET view_count = view_count + 1 WHERE id = $1

  get_popular_by_view_count: |
    SELECT id, external_id, game_name, cover_url
    FROM game.game
    ORDER BY view_count DESC
    LIMIT $1 OFFSET $2

  count_all_games: |
    SELECT COUNT(*)::int as count
    FROM game.game


platform:
  get_all: |
    SELECT id, external_id, platform_name, generation
    FROM platform.platform
    ORDER BY generation DESC NULLS LAST, platform_name ASC

  get_external_ids_by_internal_ids: |
    SELECT external_id
    FROM platform.platform
    WHERE id = ANY($1) AND external_id IS NOT NULL

  get_internal_ids_by_external_ids: |
    SELECT id
    FROM platform.platform
    WHERE external_id = ANY($1)

  upsert_many: |
    INSERT INTO platform.platform (id, external_id, platform_name, generation)
    SELECT * FROM UNNEST($1::uuid[], $2::int[], $3::varchar[], $4::int[])
    ON CONFLICT (external_id)
    DO UPDATE SET platform_name = EXCLUDED.platform_name

genre:
  upsert_many: |
    INSERT INTO genre.genre (id, external_id, genre_name)
    SELECT * FROM UNNEST($1::uuid[], $2::int[], $3::varchar[])
    ON CONFLICT (external_id)
    DO UPDATE SET genre_name = EXCLUDED.genre_name
    RETURNING id, external_id

  get_internal_ids_by_external_ids: |
    SELECT id, external_id
    FROM genre.genre
    WHERE external_id = ANY($1)

company:
  upsert_many: |
    INSERT INTO company.company (id, external_id, company_name)
    SELECT * FROM UNNEST($1::uuid[], $2::int[], $3::varchar[])
    ON CONFLICT (external_id)
    DO UPDATE SET company_name = EXCLUDED.company_name
    RETURNING id, external_id

  get_internal_ids_by_external_ids: |
    SELECT id, external_id
    FROM company.company
    WHERE external_id = ANY($1)

critic_application:
  insert: |
    INSERT INTO platform.critic_application (id, user_id)
    VALUES ($1, $2)
    RETURNING id, user_id, status, applied_at, reviewed_at, reviewed_by

  get_by_user_id: |
    SELECT id, user_id, status, applied_at, reviewed_at, reviewed_by
    FROM platform.critic_application
    WHERE user_id = $1

  get_pending: |
    SELECT ca.id, ca.user_id, ca.status, ca.applied_at, ca.reviewed_at, ca.reviewed_by,
           u.username, u.email
    FROM platform.critic_application ca
    JOIN platform.user u ON ca.user_id = u.id
    WHERE ca.status = 'pending'
    ORDER BY ca.applied_at ASC

  get_by_id: |
    SELECT id, user_id, status, applied_at, reviewed_at, reviewed_by
    FROM platform.critic_application
    WHERE id = $1

  update_status: |
    UPDATE platform.critic_application
    SET status = $2, reviewed_at = NOW(), reviewed_by = $3
    WHERE id = $1

user:
  get_by_id: |
    SELECT id, username, email, roles, is_active
    FROM platform.user
    WHERE id = $1

  add_role: |
    UPDATE platform.user
    SET roles = array_append(roles, $2)
    WHERE id = $1
    AND NOT ($2 = ANY(roles))

  has_any_admin: |
    SELECT EXISTS(
      SELECT 1 FROM platform.user
      WHERE 'Admin' = ANY(roles)
    ) as exists

  insert: |
    INSERT INTO platform.user (id, username, email, roles, is_active)
    VALUES ($1, $2, $3, $4, $5)

  insert_authenticator: |
    INSERT INTO platform.user_authenticator (id, user_id, provider, provider_id, passwd, is_verified)
    VALUES ($1, $2, 'Local', NULL, $3, $4)

review:
  upsert: |
    INSERT INTO game.review (id, user_id, game_id, review_type, rating, title, content)
    VALUES ($1, $2, $3, $4, $5, $6, $7)
    ON CONFLICT (user_id, game_id) DO UPDATE
    SET review_type = EXCLUDED.review_type,
        rating = EXCLUDED.rating,
        title = EXCLUDED.title,
        content = EXCLUDED.content,
        updated_at = NOW()
    RETURNING id, user_id, game_id, review_type, rating, title, content, created_at, updated_at

  get_by_user_and_game: |
    SELECT id, user_id, game_id, review_type, rating, title, content, created_at, updated_at
    FROM game.review
    WHERE user_id = $1 AND game_id = $2

  get_all_by_game: |
    SELECT id, user_id, game_id, review_type, rating, title, content, created_at, updated_at
    FROM game.review
    WHERE game_id = $1

  recalculate_game_ratings: |
    UPDATE game.game
    SET
      rating = (
        SELECT CASE WHEN COUNT(*) > 0 THEN AVG(rating)::float8 ELSE NULL END
        FROM game.review
        WHERE game_id = $1 AND review_type = 'user'
      ),
      critic_rating = (
        SELECT CASE WHEN COUNT(*) > 0 THEN AVG(rating)::float8 ELSE NULL END
        FROM game.review
        WHERE game_id = $1 AND review_type = 'critic'
      ),
      total_rating_count = (
        SELECT COUNT(*)
        FROM game.review
        WHERE game_id = $1
      )
    WHERE id = $1